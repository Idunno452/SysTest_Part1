version: 2.1

jobs:
  build:
    docker:
      - image: circleci/python:3.9
    working_directory: ~/SysTest_Part1
    steps:
      - checkout
      - run:
          name: "install dependencies"
          command: pip install pytest pytest-cov
      - run:
          name: "run tests"
          command: python -m pytest -v --cov

